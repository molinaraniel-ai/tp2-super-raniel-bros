<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Super Raniel Bros</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;touch-action:manipulation}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{background:#0d0d0d;color:#fff;font-family:'Trebuchet MS',Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center}
#gc{position:relative;width:100%;max-width:900px;aspect-ratio:900/480;border:3px solid #fff;border-radius:10px;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.screen{position:absolute;inset:0;background:rgba(10,10,15,.93);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:16px;z-index:5}
.screen h1{font-size:clamp(22px,5vw,42px);color:#ff4444;margin-bottom:12px;text-shadow:3px 3px #000}
.screen p{font-size:clamp(12px,2.2vw,15px);max-width:560px;line-height:1.5;margin-bottom:18px;color:#ddd}
.play{padding:14px 36px;font-size:19px;font-weight:bold;background:linear-gradient(135deg,#ff3333,#b30000);color:#fff;border:3px solid #fff;border-radius:30px;cursor:pointer}
#controls{width:100%;max-width:900px;display:flex;justify-content:space-between;padding:10px 20px}
.pad{display:flex;gap:14px}
.bt{width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.15);border:3px solid rgba(255,255,255,.6);display:flex;justify-content:center;align-items:center;font-size:22px;touch-action:none}
.bt:active{background:rgba(255,255,255,.4)}
.bj{background:#ff3333;width:78px;height:78px}
.screen h1.title{font-size:clamp(30px,8.5vw,74px);font-weight:900;line-height:1;letter-spacing:2px;margin-bottom:6px;background:linear-gradient(#fff36b,#ff8a00 55%,#ff2d2d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(4px 4px 0 #000) drop-shadow(0 0 14px rgba(255,80,0,.7));animation:bob 2s ease-in-out infinite}
.title span{font-size:.5em;letter-spacing:.45em}
@keyframes bob{50%{transform:translateY(-6px) scale(1.03)}}
#ss{background:rgba(8,10,30,.5)}
.sub{font-size:clamp(13px,2.6vw,18px)!important;font-weight:bold;margin:6px 0 14px!important}
.cards{display:flex;gap:12px;justify-content:center}
.card{width:clamp(88px,23vw,160px);padding:10px 6px;border:3px solid #fff;border-radius:14px;background:linear-gradient(#3a7bff,#1c3fa8);color:#fff;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 5px 0 #0d1f66}
.card b{font-size:clamp(22px,5vw,34px)}.card span{font-size:clamp(10px,2vw,14px);font-weight:bold}.card i{font-style:normal;font-size:clamp(14px,3vw,20px)}
.card:active{transform:translateY(3px)}.card.lock{background:#444;filter:grayscale(1);opacity:.7;box-shadow:0 5px 0 #222}
.bm{width:48px;height:48px;font-size:18px;align-self:center}
</style></head><body>
<div id="gc"><canvas id="c" width="900" height="480"></canvas>
<div id="ss" class="screen"><h1 class="title"><span>SUPER</span><br>RANIEL BROS</h1><p class="sub">¡Elegí tu aventura!</p>
<div class="cards"><button class="card" id="lv1"><b>1</b><span>Pradera Solar</span><i id="lk1"></i></button><button class="card" id="lv2"><b>2</b><span>Cuevas de Cristal</span><i id="lk2"></i></button><button class="card" id="lv3"><b>3</b><span>Fortaleza de Lava</span><i id="lk3"></i></button></div></div>
<div id="es" class="screen" style="display:none"><h1 id="et"></h1><p id="em"></p><div class="cards"><button class="play" id="rb">↻ REINTENTAR</button><button class="play" id="mb">☰ MENÚ</button></div></div></div>
<div id="controls"><div class="pad"><div class="bt" id="bl">◀</div><div class="bt" id="br">▶</div></div><div class="bt bm" id="bm">☰</div><div class="bt bj" id="bj">▲</div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
const T=32,W=900,H=480,R=15,G=.58,PI=Math.PI;
let map,LW,pipes,ents,parts,items,bmp,boss,goal,cam=0,lvl=1,score=0,lvlScore=0,coins=0,lives=3,time=200,frame=0,state='menu',st=0,fph=0,fy=0,ban=0;
const keys={l:0,r:0,u:0},NAMES=['','Pradera Solar','Cuevas de Cristal','Fortaleza de Lava'];
const P={x:0,y:0,w:26,h:40,vx:0,vy:0,big:0,inv:0,face:1,ground:0,anim:0,jh:0,hide:0};
const TH={1:{g:'#b5651d',gt:'#3cb043',b:'#c8622a',m:'#6b2e0e'},2:{g:'#3a4064',gt:'#7a84b8',b:'#5a4a8a',m:'#2a2050'},3:{g:'#2b2b2f',gt:'#55555c',b:'#4d3a3a',m:'#1a1010'}};
let ac;function sfx(f,d=.1,ty='square',f2){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type=ty;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(.05,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(n+d)}catch(e){}}
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const el=(x,y,rx,ry,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,2*PI);ctx.fill()};
const rc=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h)};
const circ=(x,y,r)=>{ctx.moveTo(x+r,y);ctx.arc(x,y,r,0,2*PI)};
function solid(tx,ty){if(ty<0||ty>=R)return false;if(tx<0)return true;if(tx>=LW)return false;const v=map[ty][tx];return v>0&&v<8}
function move(e){
 e.x+=e.vx;let hx=false;
 if(e.vx){const tx=Math.floor((e.vx>0?e.x+e.w:e.x)/T);for(let ty=Math.floor(e.y/T);ty<=Math.floor((e.y+e.h-1)/T);ty++)if(solid(tx,ty)){e.x=e.vx>0?tx*T-e.w:(tx+1)*T;hx=true;break}}
 e.vy+=G;e.y+=e.vy;e.ground=false;let hy=0;
 const ty=Math.floor((e.vy>0?e.y+e.h:e.y)/T);
 for(let tx=Math.floor(e.x/T);tx<=Math.floor((e.x+e.w-1)/T);tx++)if(solid(tx,ty)){if(e.vy>0){e.y=ty*T-e.h;e.ground=true;hy=1}else{e.y=(ty+1)*T;hy=-1;e.btx=tx;e.bty=ty}e.vy=0;break}
 return{hx,hy}}
function pop(x,y,txt){parts.push({txt,x,y,vx:0,vy:-1.2,life:50})}
function shards(x,y,c){for(let i=0;i<4;i++)parts.push({x:x+(i%2)*16,y:y+(i>>1)*16,vx:i%2?2:-2,vy:-6+(i>>1)*2,life:50,c,g:1})}

function build(n){
 LW=[0,210,200,150][n];map=Array.from({length:R},()=>Array(LW).fill(0));
 pipes=[];ents=[];parts=[];items={};bmp={};boss=null;
 const set=(x,y,v)=>{if(x>=0&&x<LW&&y>=0&&y<R)map[y][x]=v};
 const row=(x,y,s)=>[...s].forEach((c,i)=>{if(c==='B')set(x+i,y,2);if(c==='S')set(x+i,y,5);if(c==='?'||c==='M'){set(x+i,y,3);items[(x+i)+','+y]=c}});
 const gap=(x,w,l)=>{for(let i=0;i<w;i++){set(x+i,13,l?9:0);set(x+i,14,l?9:0)}};
 const pipe=(x,h,pl)=>{for(let i=0;i<h;i++){set(x,12-i,6);set(x+1,12-i,6)}pipes.push({x:x*T,y:(13-h)*T,w:2*T,h:h*T,pl,py:0,c:x*9})};
 const tower=(x,h)=>{for(let i=0;i<h;i++){set(x,12-i,5);set(x+1,12-i,5)}};
 const spk=(x,k)=>{for(let i=0;i<k;i++)set(x+i,12,8)};
 const ceil=(x,w,h)=>{for(let i=0;i<w;i++)for(let j=0;j<h;j++)set(x+i,2+j,1)};
 const spring=x=>ents.push({t:'spring',x:x*T+2,y:13*T-24,w:28,h:24,comp:0});
 const plat=(x,y,r,v,ph)=>ents.push({t:'plat',x:x*T,y:y*T,w:80,h:14,ox:x*T,oy:y*T,r,v,ph,dx:0,dy:0});
 const coin=(x,y,k)=>{for(let i=0;i<k;i++)ents.push({t:'coin',x:(x+i)*T+8,y:y*T+8,w:16,h:16})};
 const E=(t,x)=>{const e={t,x:x*T,vx:-.7,vy:0};
  if(t==='goomba'){e.w=30;e.h=30;e.y=13*T-30}
  if(t==='koopa'){e.w=30;e.h=44;e.y=13*T-44;e.vx=-.6}
  if(t==='spiny'){e.w=30;e.h=26;e.y=13*T-26;e.vx=-.8}
  if(t==='bat'){e.w=36;e.h=26;e.by=185+(x%3)*14;e.y=e.by;e.bx=e.x;e.ph=x}
  if(t==='fire'){e.w=20;e.h=20;e.y=H+30;e.vy=0;e.tm=x%40}
  ents.push(e)};
 for(let x=0;x<LW;x++){set(x,13,1);set(x,14,1);if(n>1){set(x,0,1);set(x,1,1)}}
 goal=(n===3?LW-10:LW-14)*T;set(goal/T,12,5);
 if(n===1){
  gap(34,3);gap(56,9);gap(126,8);gap(150,3);spk(76,3);
  pipe(20,2);pipe(44,3,1);pipe(86,2,1);pipe(142,3,1);
  tower(96,2);tower(100,1);tower(104,3);tower(108,1);tower(112,2);tower(172,3);tower(178,2);tower(184,3);
  plat(57,11,150,0,0);plat(129,11,120,0,1);spring(118);
  row(121,6,'BBBBBB');row(123,3,'M');row(12,9,'?B?');row(26,9,'BMB');row(48,8,'B?B');row(100,7,'??');row(150,9,'B?B');
  coin(10,10,4);coin(37,8,2);coin(58,8,3);coin(97,9,2);coin(121,4,6);coin(130,8,3);coin(165,10,4);
  [28,70,92,190].forEach(x=>E('goomba',x));[50,138].forEach(x=>E('koopa',x));[82,160].forEach(x=>E('spiny',x));
 }else if(n===2){
  gap(26,3);gap(58,4);gap(96,10);spk(72,4);spk(120,5);ceil(80,10,5);ceil(36,10,2);
  pipe(18,2);pipe(46,3,1);pipe(66,2);pipe(132,3,1);
  plat(97,9,70,1,0);plat(100,9,70,1,2);plat(103,9,70,1,4);spring(140);
  row(10,9,'B?B?B');row(30,9,'BMB');row(60,8,'BB');row(78,9,'?B?');row(114,9,'B?B');row(143,5,'B?BMB?B');row(160,9,'?B?B?');
  coin(8,10,4);coin(27,8,2);coin(59,7,3);coin(97,5,8);coin(122,8,3);coin(143,3,7);
  tower(172,2);tower(178,3);
  [12,54,118,165].forEach(x=>E('bat',x));[23,84,150].forEach(x=>E('goomba',x));[112,156].forEach(x=>E('spiny',x));E('koopa',166);
 }else{
  gap(20,3,1);gap(34,4,1);gap(52,3,1);gap(62,12,1);gap(80,3,1);spk(28,3);spk(42,2);
  pipe(46,2,1);pipe(76,2,1);plat(64,11,130,0,0);plat(69,11,130,0,3);
  row(10,9,'BB?BB');row(26,8,'SSS');row(40,9,'B?B');row(56,9,'BMB');row(100,9,'SSS');row(112,9,'SSS');
  coin(20,9,3);coin(35,8,3);coin(53,8,2);coin(64,8,8);coin(100,7,3);coin(112,7,3);
  [21,35,53,68,81].forEach(x=>E('fire',x));[14,86].forEach(x=>E('goomba',x));E('spiny',58);E('koopa',90);
  boss={t:'boss',x:(96+(Math.random()*18|0))*T,y:13*T-96,w:96,h:96,vx:-1.1,vy:0,hp:5,inv:0,sh:0,jt:0};ents.push(boss);
 }
 Object.assign(P,{x:2*T,y:10*T,vx:0,vy:0,big:0,h:40,inv:0,hide:0,face:1,ground:0,spr:0});
 cam=0;time=n===3?240:200;st=0;fph=0;fy=3*T+8;ban=150}

let unlocked=1;try{unlocked=+localStorage.getItem('rb_u')||1}catch(e){}
function showMenu(){state='menu';lvl=1+(Math.random()*unlocked|0);build(lvl);P.hide=1;ban=0;$('es').style.display='none';$('ss').style.display='flex';[1,2,3].forEach(i=>{$('lv'+i).classList.toggle('lock',i>unlocked);$('lk'+i).textContent=i>unlocked?'🔒':'★'})}
function startGame(n){sfx(520,.1);$('ss').style.display='none';$('es').style.display='none';score=0;lvlScore=0;lives=3;coins=0;lvl=n;build(n);state='play'}
function endGame(w){state='over';$('es').style.display='flex';$('et').textContent=w?'¡VICTORIA TOTAL! 🎉':'GAME OVER 💀';$('et').style.color=w?'#3ddc84':'#ff4444';$('em').textContent=(w?'Derrotaste al Devorador de Sombras. ':'Te quedaste sin vidas. ')+'Puntaje: '+score}
function nextLevel(){unlocked=Math.max(unlocked,Math.min(3,lvl+1));try{localStorage.setItem('rb_u',unlocked)}catch(e){}if(lvl<3){lvl++;lvlScore=score;build(lvl);state='play'}else endGame(true)}
function die(){if(state!=='play')return;state='dead';st=0;P.vy=-11;P.vx=0;sfx(400,.6,'sawtooth',70)}
function afterDeath(){lives--;if(lives<=0)endGame(false);else{score=lvlScore;build(lvl);state='play'}}
function hurt(){if(P.inv>0||state!=='play')return;if(P.big){P.big=0;P.y+=16;P.h=40;P.inv=110;sfx(200,.3,'sawtooth',90)}else die()}
function eat(){if(!P.big){P.big=1;P.h=56;P.y-=16}score+=1000;sfx(500,.3,'square',1000);pop(P.x,P.y,'+1000')}

function bump(tx,ty){const v=map[ty][tx],k=tx+','+ty;
 if(v===3){map[ty][tx]=4;bmp[k]=10;
  if(items[k]==='M'){ents.push({t:'mush',x:tx*T+2,y:ty*T-30,w:28,h:28,vx:1.6,vy:0,act:1});sfx(440,.2,'triangle',880)}
  else{coins++;score+=200;pop(tx*T+8,ty*T-10,'+200');sfx(988,.15,'square',1318)}}
 else if(v===2){if(P.big){map[ty][tx]=0;shards(tx*T,ty*T,TH[lvl].b);score+=50;sfx(150,.15,'sawtooth',60)}else{bmp[k]=10;sfx(150,.08)}}
 ents.forEach(e=>{if(!e.dead&&(e.t==='goomba'||e.t==='koopa')&&e.x+e.w>tx*T&&e.x<tx*T+T&&Math.abs(e.y+e.h-ty*T)<6){e.dead=1;score+=100}})}

function playerUpdate(){
 const a=P.ground?.55:.35,sp=3.9;
 if(keys.r&&!keys.l){P.vx=Math.min(P.vx+a,sp);P.face=1}
 else if(keys.l&&!keys.r){P.vx=Math.max(P.vx-a,-sp);P.face=-1}
 else{P.vx*=P.ground?.78:.95;if(Math.abs(P.vx)<.1)P.vx=0}
 if(keys.u){if(P.ground&&!P.jh){P.vy=-12.8;P.jh=1;sfx(380,.18,'square',760)}}else{P.jh=0;if(P.vy<-4.5&&!P.spr)P.vy=-4.5}
 if(P.inv>0)P.inv--;
 const was=P.ground;
 for(const e of ents)if(e.t==='plat'&&P.ground&&Math.abs(P.y+P.h-e.y)<4&&P.x+P.w>e.x&&P.x<e.x+e.w){P.x+=e.dx;P.y+=e.dy;break}
 const pb=P.y+P.h,r=move(P);
 for(const e of ents)if(e.t==='plat'&&P.vy>=0&&P.x+P.w>e.x&&P.x<e.x+e.w&&pb<=e.y+6&&P.y+P.h>=e.y){P.y=e.y-P.h;P.vy=0;P.ground=true;break}
 if(P.ground){P.spr=0;if(!was)for(let i=0;i<3;i++)parts.push({x:P.x+i*10,y:P.y+P.h-4,vx:(i-1)*.8,vy:-.8,life:18,c:'rgba(255,255,255,.6)',s:5})}
 P.anim+=Math.abs(P.vx)*.12;
 if(r.hy<0){let tx=Math.floor((P.x+P.w/2)/T);const ty=P.bty;if(!(map[ty][tx]===2||map[ty][tx]===3))tx=P.btx;bump(tx,ty)}
 {const ty=Math.floor((P.y+P.h-6)/T);if(map[ty])for(let tx=Math.floor((P.x+4)/T);tx<=Math.floor((P.x+P.w-4)/T);tx++)if(map[ty][tx]===8&&P.y+P.h>(ty+1)*T-20)hurt()}
 P.x=Math.max(P.x,cam);P.x=Math.min(P.x,LW*T-P.w);if(boss&&!boss.dead)P.x=Math.min(P.x,124*T-P.w);
 if(P.y>H+10)die();
 cam=Math.max(cam,Math.min(LW*T-W,P.x-W*.4));
 if(state==='play'&&P.x+P.w>=goal-1){state='flag';fph=0;P.vx=0;P.vy=0;P.x=goal+14-P.w;const b=Math.max(1,Math.round((13*T-P.y)/T/2))*500;score+=b;pop(P.x,P.y-20,'+'+b);sfx(700,.5,'square',1400)}}

function flagSeq(){
 if(fph===0){P.y+=3;fy=Math.min(fy+3,12*T-36);if(P.y+P.h>=12*T){P.y=12*T-P.h;fph=1;st=0}}
 else if(fph===1){if(++st>25){fph=2;P.x=goal+22;P.face=1}}
 else if(fph===2){P.vx=2.2;move(P);P.anim+=.25;if(P.x>goal+3*T+50){P.hide=1;fph=3;st=0}}
 else{if(time>0){time--;score+=10;if(frame%3===0)sfx(1200,.03)}else if(++st>40)nextLevel()}}

function bossUpdate(b){
 const lo=94*T,hi=118*T,rage=1+(5-b.hp)*.2,rnd=(a,c)=>a+Math.random()*(c-a);
 if(b.inv>0)b.inv--;if(b.tel>0)b.tel--;
 if(!b.mode){b.mode='idle';b.wait=70}
 b.fc=P.x<b.x?-1:1;b.wait--;
 const idle=w=>{b.mode='idle';b.wait=w||(rnd(40,110)/rage|0);b.vx=0;b.slam=0},m=b.mode;
 if(m==='idle'){if(b.wait%45===0)b.vx=rnd(-1.8,1.8)*rage;
  if(b.wait<=0){const o=['jump','dash','volley','warp','slam'].filter(x=>x!==b.last);b.mode=b.last=o[Math.random()*o.length|0];b.vx=0;b.wait=b.tel={jump:25,dash:45,volley:50,warp:35,slam:30}[b.mode]}}
 else if(m==='jump'&&b.wait<=0){b.vy=-rnd(9,14);b.vx=Math.sign(P.x-b.x)*rnd(1,3.5);b.mode='air'}
 else if(m==='slam'&&b.wait<=0){b.vy=-15;b.vx=Math.sign(P.x-b.x)*1.5;b.mode='air';b.slam=1}
 else if(m==='dash'&&b.wait<=0){b.vx=b.fc*rnd(5,7.5)*rage;b.mode='dashing';b.wait=70}
 else if(m==='dashing'&&b.wait<=0)idle();
 else if(m==='volley'&&b.wait<=0){for(let k=0,n=2+(Math.random()*3|0);k<n;k++)ents.push({t:'bfire',x:b.x+(b.fc>0?b.w:-18),y:b.y+30,w:18,h:18,vx:b.fc*rnd(2.5,5.5),vy:rnd(-2.5,1.5),act:1});idle()}
 else if(m==='warp'&&b.wait<=0){b.x=rnd(lo,hi);b.inv=30;idle(30)}
 else if(m==='air'&&b.ground&&b.wait<-5){if(b.slam){sfx(80,.3,'sawtooth',40);[-1,1].forEach(d=>ents.push({t:'bfire',x:b.x+48,y:13*T-18,w:18,h:18,vx:d*4.5,vy:0,act:1}))}idle()}
 move(b);if(b.x<lo){b.x=lo;b.vx=Math.abs(b.vx)}if(b.x>hi){b.x=hi;b.vx=-Math.abs(b.vx)}
 if(b.inv===0&&ov(P,b)){
  if(P.vy>0&&(P.y+P.h-P.vy)<=b.y+30){b.hp--;b.inv=80;P.vy=-12;sfx(120,.25,'sawtooth',60);score+=500;pop(b.x+40,b.y,'+500');idle(40);
   if(b.hp<=0){b.dead=1;score+=2000;shards(b.x,b.y,'#7a1e1e');shards(b.x+48,b.y+40,'#1b1226');sfx(80,.6,'sawtooth',40)}}
  else hurt()}}

function entsUpdate(){
 pipes.forEach(p=>{if(!p.pl)return;p.c++;const cy=p.c%280,tg=(cy>60&&cy<210)?46:0;
  p.py+=Math.sign(tg-p.py)*Math.min(.9,Math.abs(tg-p.py));
  if(p.py>12&&ov(P,{x:p.x+p.w/2-13,y:p.y-p.py+4,w:26,h:p.py-4}))hurt()});
 for(const e of ents){
  if(e.dead)continue;const t=e.t;

 parts.forEach(p=>{if(p.txt){ctx.font='bold 14px Arial';ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.strokeText(p.txt,p.x,p.y);ctx.fillStyle='#fff';ctx.fillText(p.txt,p.x,p.y)}else rc(p.x,p.y,p.s||10,p.s||10,p.c)});
 ctx.restore();
 if(state!=='menu'){rc(0,0,W,30,'rgba(0,0,0,.55)');ctx.textBaseline='middle';ctx.font='bold 15px Trebuchet MS,Arial';
 ctx.fillStyle='#ff4d6d';ctx.fillText('♥',16,16);ctx.fillStyle='#fff';ctx.fillText('x'+lives,34,16);
 ctx.fillStyle='#3ec8ff';ctx.beginPath();ctx.moveTo(106,7);ctx.lineTo(113,16);ctx.lineTo(106,25);ctx.lineTo(99,16);ctx.fill();ctx.fillStyle='#fff';ctx.fillText('x'+coins,118,16);
 ctx.fillStyle='#ffd23c';ctx.fillText('★',200,16);ctx.fillStyle='#fff';ctx.fillText(score,220,16);
 ctx.fillText('MUNDO '+lvl+' · '+NAMES[lvl],330,16);ctx.fillStyle=time<30?'#ff5555':'#fff';ctx.fillText('TIEMPO '+time,770,16)}
 if(ban>0){ctx.globalAlpha=Math.min(1,ban/40);ctx.textAlign='center';ctx.font='bold 34px Trebuchet MS,Arial';ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=5;const s='MUNDO '+lvl+' — '+NAMES[lvl].toUpperCase();ctx.strokeText(s,W/2,170);ctx.fillText(s,W/2,170);ctx.textAlign='left';ctx.globalAlpha=1}}

/* ---------- CONTROL ---------- */
const km={ArrowRight:'r',d:'r',ArrowLeft:'l',a:'l',ArrowUp:'u',w:'u',' ':'u'};
addEventListener('keydown',e=>{const k=km[e.key];if(k){keys[k]=1;e.preventDefault()}});
addEventListener('keyup',e=>{const k=km[e.key];if(k)keys[k]=0});
[['bl','l'],['br','r'],['bj','u']].forEach(([id,k])=>{const el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=1});['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n,()=>keys[k]=0));el.addEventListener('contextmenu',e=>e.preventDefault())});
[1,2,3].forEach(i=>$('lv'+i).addEventListener('click',()=>{if(i<=unlocked)startGame(i);else sfx(120,.15)}));$('rb').addEventListener('click',()=>startGame(lvl));$('mb').addEventListener('click',showMenu);$('bm').addEventListener('click',showMenu);
showMenu();
let last=0,acc=0;
function loop(t){acc+=Math.min(t-last,100);last=t;while(acc>=16.67){if(state==='menu'){frame++;cam+=1;if(cam>LW*T-W)cam=0}else if(state!=='over')update();acc-=16.67}draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
